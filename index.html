<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roma Quest">
<title>Roma Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
:root{--bg:rgba(250,250,250,.74);--solid:#fff;--card:rgba(255,255,255,.92);--fill:rgba(118,118,128,.12);--text:#1c1c1e;--sub:#6e6e73;--sep:rgba(60,60,67,.15);--blue:#3476f3;--green:#30b852;--shadow:0 10px 34px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.1)}
body.dark{--bg:rgba(38,40,46,.74);--solid:#2a2c32;--card:rgba(66,68,76,.62);--fill:rgba(118,118,128,.3);--text:#f2f2f7;--sub:#a3a3ab;--sep:rgba(235,235,245,.16);--shadow:0 10px 34px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--text);background:#f3f2ec;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
#map{position:fixed;inset:0}
#drag{display:none;position:fixed;left:0;right:0;top:0;height:28px;z-index:4}
body.tauri #drag{display:block}
.glass{background:var(--bg);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow)}
#panel{position:fixed;z-index:10;left:10px;top:10px;bottom:10px;width:352px;display:flex;flex-direction:column;overflow:hidden;border-radius:16px}
body.tauri #panel{top:36px}
#grab{display:none;height:20px;flex:none;position:relative}
#grab:after{content:'';position:absolute;left:50%;top:7px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--sep)}
#top{padding:12px 12px 8px;flex:none}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:10px;background:var(--fill)}
.search svg{flex:none;opacity:.55}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px}
.search input::placeholder{color:var(--sub)}
#clr{display:none;width:18px;height:18px;border-radius:50%;background:var(--sub);color:var(--solid);font-size:13px;line-height:18px;text-align:center}
.seg{display:flex;margin-top:10px;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{flex:1;height:28px;border-radius:7px;font-weight:600;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
#body{flex:1;overflow:auto;padding:4px 12px 14px;overscroll-behavior:contain}
.card{background:var(--card);border-radius:12px;padding:12px;margin-top:10px}
.card h3{margin:0 0 2px;font-size:17px;letter-spacing:-.01em}
.sub{color:var(--sub);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--fill);font-size:11.5px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13.5px;background:var(--fill)}
.btn.p{background:var(--blue);color:#fff}
.btn.g{background:var(--green);color:#fff}
.btn.d{color:#ff3b30}
.btn.w{width:100%}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.days button{height:34px;border-radius:9px;background:var(--fill);font-weight:600;font-size:13px;position:relative}
.days button.rest{opacity:.7}
.days button.done{background:var(--green);color:#fff}
.days button.sel{outline:2.5px solid var(--blue);outline-offset:-1px}
.days button.cur:after{content:'';position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#ff9f0a}
.mis{margin-top:10px}
.mis .row{font-size:13px}
.mis b{font-variant-numeric:tabular-nums}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px}
.it{margin:6px 0 0;padding:8px 10px;border-radius:9px;background:var(--fill);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:5px 10px;border-radius:99px;background:var(--fill);font-size:12.5px;font-weight:600}
.chip.on{background:var(--blue);color:#fff}
.list{margin-top:10px;background:var(--card);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-top:.5px solid var(--sep)}
.li:first-child{border-top:0}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li>div{min-width:0}
.li:after{content:'›';margin-left:auto;color:var(--sub);font-size:18px}
.empty{padding:26px 10px;text-align:center;color:var(--sub)}
#detail{position:absolute;inset:0;background:var(--solid);transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:3}
#detail.open{transform:none}
#dtop{padding:12px;flex:none;display:flex;align-items:center;gap:8px}
#dbody{flex:1;overflow:auto;padding:0 12px 16px}
.back{color:var(--blue);font-weight:600;font-size:15px}
.f{margin-top:10px}
.f label{display:block;font-size:11.5px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 4px}
.f input,.f select,.f textarea{width:100%;border:0;outline:0;border-radius:9px;background:var(--fill);padding:8px 10px;font-size:14.5px}
.f textarea{min-height:76px;resize:vertical}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st button{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;background:var(--fill);font-weight:600;font-size:13px}
.st button.on{outline:2px solid var(--blue);outline-offset:-1px;background:var(--card)}
#ctl{position:fixed;z-index:9;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
body.tauri #ctl{top:36px}
.grp{border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.grp button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:300;color:var(--text)}
.grp button+button{border-top:.5px solid var(--sep)}
#zoom{position:fixed;z-index:9;right:10px;bottom:34px}
#cmp svg{transition:transform .1s}
#scan{position:fixed;z-index:9;top:12px;left:calc(50% + 181px);transform:translateX(-50%);height:34px;padding:0 16px;border-radius:99px;font-weight:600;font-size:13.5px;color:var(--blue);display:none;white-space:nowrap}
body.tauri #scan{top:38px}
#scan.busy{opacity:.7}
#toast{position:fixed;z-index:30;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;transition:.25s;padding:9px 16px;border-radius:99px;font-weight:600;font-size:13.5px;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pin{cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin svg{display:block;transition:transform .15s;transform-origin:50% 100%}
.pin.sel svg{transform:scale(1.25)}
.cand{width:18px;height:18px;border-radius:50%;background:#6d7a8a;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;display:flex;align-items:center;justify-content:center}
.scout{width:20px;height:20px;border-radius:50%;background:#3a4250;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;color:#fff;font:700 10px/16px -apple-system,system-ui,sans-serif;text-align:center}
body.dark .scout{background:#e9ecef;color:#1f252d;border-color:#1f252d}
.cand:before{content:'';width:6px;height:6px;border-radius:1px;background:#fff}
.home{padding:3px 8px;border-radius:99px;background:var(--blue);color:#fff;font-weight:700;font-size:11.5px;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;white-space:nowrap}
.me{width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 6px rgba(52,118,243,.25)}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(255,255,255,.7)!important}
.maplibregl-ctrl-bottom-left{left:370px}
a{color:var(--blue);text-decoration:none}
@media (max-width:720px){
 #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:48vh;border-radius:18px 18px 0 0;transition:height .25s}
 #panel.peek{height:132px}#panel.full{height:90vh}
 body.tauri #panel{top:auto}
 #grab{display:block}
 #zoom{display:none}
 #scan{left:50%;top:max(12px,env(safe-area-inset-top))}
 .maplibregl-ctrl-bottom-left{left:0;bottom:calc(48vh)}
 #ctl{top:max(10px,env(safe-area-inset-top))}
 #toast{bottom:calc(48vh + 14px)}
 input,select,textarea,.f input,.f select,.f textarea,.search input{font-size:16px}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="drag" data-tauri-drag-region></div>

<aside id="panel" class="glass">
 <div id="grab"></div>
 <div id="top">
  <div class="search">
   <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
   <input id="q" type="search" placeholder="Search Rome" autocomplete="off" autocorrect="off" spellcheck="false">
   <button id="clr" aria-label="Clear">×</button>
  </div>
  <div class="seg" id="seg"><button data-t="quest" class="on">Quest</button><button data-t="places">Places</button></div>
 </div>
 <div id="body"></div>
 <section id="detail"><div id="dtop"></div><div id="dbody"></div></section>
</aside>

<button id="scan" class="glass">Scan this area</button>

<div id="ctl">
 <div class="grp glass">
  <button id="mode" title="Light / dark" aria-label="Appearance"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></svg></button>
  <button id="loc" title="My location" aria-label="My location"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 3L3 10.5l7.5 2.5L13 21z"/></svg></button>
  <button id="cmp" title="North" aria-label="Reset north"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3l4 9H8z" fill="#ff3b30"/><path d="M12 21l-4-9h8z" fill="currentColor" opacity=".45"/></svg></button>
 </div>
</div>
<div id="zoom" class="grp glass"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button></div>
<div id="toast" class="glass"></div>

<script src="maplibre-gl.js"></script>
<script src="scout.js"></script>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TAURI=!!(window.__TAURI__||window.__TAURI_INTERNALS__);
if(TAURI)document.body.classList.add('tauri');

/* ---------- data ---------- */
const STATUS=[
 {k:'todo',t:'To visit',c:'#3478f6',xp:10},
 {k:'visited',t:'Visited',c:'#ff9f0a',xp:20},
 {k:'cv',t:'CV dropped',c:'#af52de',xp:30},
 {k:'interview',t:'Interview',c:'#30b852',xp:100},
 {k:'hired',t:'Hired',c:'#e6b800',xp:500},
 {k:'no',t:'Not hiring',c:'#8e8e93',xp:5}
];
const SK=Object.fromEntries(STATUS.map(s=>[s.k,s]));
const VIS=['visited','cv','interview','hired'],CVD=['cv','interview','hired'];
const TYPES=['Warehouse','Wholesale','Cash & carry','Store','Logistics hub','Airport','Agency','Job centre','Other'];
const START=[41.8943,12.4932]; // Metro B Cavour
const Z=(d,name,sub,ll,z,tip,rest)=>({d,name,sub,ll,z,tip:tip||'',rest:!!rest});
const ZONES=[
 Z(1,'Esquilino & Termini','Warm-up · ask, listen, collect names',[41.8905,12.5067],15,'Walk Via Giolitti and Via Principe Amedeo. Wholesale is restricted in Esquilino, so use the day to learn the trade and collect leads.'),
 Z(2,"Via dell'Omo",'Core wholesale zone · Torre Maura',[41.8871,12.6123],16,'Local listings call it the heart of Chinese wholesale in Rome. Work street by street and ask for the warehouse manager.'),
 Z(3,"Via dell'Omo · side lanes",'Second sweep',[41.8871,12.6123],16,'Cover the back gates and side lanes you skipped on Day 2.'),
 Z(4,'Via della Vaccheria Gianni','Cash & carry cluster',[41.8881,12.6068],16,'Listings place a Chinese cash & carry here. Ask about loading, picking and stock roles.'),
 Z(5,'Tor Tre Teste · Prenestina','Industrial strip',[41.8832,12.5889],15,'Follow the Prenestina corridor. Note every unit with a loading bay.'),
 Z(6,'Tor Sapienza','Via Prenestina · Via di Tor Cervara',[41.9059,12.5879],15,'Warehouses and depots along the Prenestina and the railway.'),
 Z(7,'Rest · follow up','Update pins, call back, print CVs',START,14,'Update statuses, call the warm leads, print 15 fresh CVs.',true),
 Z(8,'Pietralata','Via Tiburtina industrial belt',[41.9149,12.5551],15,'Metro B runs direct from Cavour to Pietralata.'),
 Z(9,'Tiburtina · Case Rosse','Via Tiburtina warehouses',[41.9414,12.6408],14,'Metro B to Ponte Mammolo, then bus along Via Tiburtina. Check the ATAC app.'),
 Z(10,'Commercity · day 1','Ponte Galeria wholesale city',[41.8072,12.3350],15,'Listings call it the largest wholesale hub in central Italy, with many Chinese-run units. Go early. Metro B to Piramide, then FL1 to Fiera di Roma.'),
 Z(11,'Commercity · day 2','Second sweep',[41.8072,12.3350],15,'Different blocks, different managers. Ask each unit who hires.'),
 Z(12,'Magliana','Via della Magliana',[41.8226,12.4022],15,'FL1 stops at Magliana.'),
 Z(13,'Rest · follow up','Update pins, call back',START,14,'Review the week. Double down on the zones that gave leads.',true),
 Z(14,'Torpignattara','Via Casilina · Via Acqua Bullicante',[41.8778,12.5423],15,'Small stockrooms and shops. Ask who needs a loader or driver.'),
 Z(15,'Pigneto & Casal Bertone','Shops and stockrooms',[41.8884,12.5281],15,'Dense streets: go on foot, shop by shop.'),
 Z(16,'Quadraro · Tuscolano','Via Tuscolana',[41.8662,12.5471],15,'The new Chinese commercial belt in the south-east.'),
 Z(17,'Cinecittà','Via Tuscolana · Via Appia Nuova',[41.8493,12.5744],15,'Work the Tuscolana towards Cinecittà.'),
 Z(18,'Appia Nuova','Via Appia Nuova',[41.8749,12.5221],15,'Shops, depots and cash & carries along the Appia.'),
 Z(19,'Rest · follow up','Update pins, call back',START,14,'Call the warm leads. Plan the second pass.',true),
 Z(20,'Prenestina · second pass','Revisit warm leads',[41.9059,12.5879],15,'Return to the places that said "come back".'),
 Z(21,"Via dell'Omo · third pass",'Revisit warm leads',[41.8871,12.6123],16,'Ask for the manager by name this time.'),
 Z(22,'Commercity · third pass','Revisit warm leads',[41.8072,12.3350],15,'Bring a fresh CV to every unit that showed interest.'),
 Z(23,'Tiburtina · second pass','Revisit warm leads',[41.9149,12.5551],15,'Pietralata and Tiburtina leads.'),
 Z(24,'Rest · follow up','Update pins, call back',START,14,'Count CVs dropped. Cut dead leads.',true),
 Z(25,'Fiumicino Airport (FCO)','Staffing offices · spoken-management roles',[41.8003,12.2389],14,'Bring the CV. Ask for HR and staffing contacts at ground handlers and service companies. Metro B to Piramide, then FL1 to Fiumicino Aeroporto.'),
 Z(26,'Torpignattara · second pass','Revisit warm leads',[41.8778,12.5423],15,'Return to the places that said "come back".'),
 Z(27,'Tuscolano · second pass','Revisit warm leads',[41.8662,12.5471],15,'Quadraro and Cinecittà leads.'),
 Z(28,'Hot leads','Calls and visits',START,14,'Call, then visit. Only the strongest leads.',true),
 Z(29,'Interviews & trial shifts','Say yes to trials',START,14,'Dress sharp. Confirm every trial in writing.',true),
 Z(30,'Review · choose the job','Pick the best offer',START,14,'Compare pay, hours, location and growth. Pick, then thank everyone else.',true)
];
const PHRASES=[
 ['Buongiorno, cerco lavoro in magazzino. Avete bisogno di personale?','Good morning, I am looking for warehouse work. Do you need staff?'],
 ['Posso lasciarvi il mio CV?','May I leave you my CV?'],
 ['Con chi posso parlare per le assunzioni?','Who can I talk to about hiring?'],
 ['Posso ripassare domani?','Can I come back tomorrow?']
];
const PAL={
 light:{land:'#f3f2ec',grass:'#dcecc4',wood:'#cfe6b3',park:'#cfe8b3',ind:'#e8e4d8',indE:'#d5cfbb',com:'#f7edd3',hosp:'#f3dede',school:'#efe7d6',water:'#a4d8f0',bld:'#ecebe5',bldE:'#e4e3dd',b3d:'#ecebe5',air:'#ecebe6',rwy:'#dcdbd5',road:'#fefef9',cas:'#dedcd4',hw:'#fdd98e',hwc:'#e3b866',rail:'#b5b5b0',path:'#d1d0c8',rt:'#6b6b66',halo:'rgba(255,255,255,.9)',dist:'#77746c',city:'#26262a',wt:'#4f95b5',poi:'#7d7d85'},
 dark:{land:'#1f252d',grass:'#223228',wood:'#1f3328',park:'#21362b',ind:'#272d35',indE:'#37404b',com:'#2a2d3a',hosp:'#33292f',school:'#2d2b2a',water:'#14283a',bld:'#2b323b',bldE:'#343c46',b3d:'#2f3740',air:'#262c33',rwy:'#313942',road:'#434d5a',cas:'#161b21',hw:'#8a6d3b',hwc:'#4d3d22',rail:'#5b6672',path:'#3a444f',rt:'#9aa4b0',halo:'rgba(25,30,36,.92)',dist:'#9aa0a8',city:'#e9ecef',wt:'#6aa3c7',poi:'#9aa4b0'}
};

/* ---------- state ---------- */
const KEY='romaQuest.v1';
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
S=Object.assign({start:null,sel:1,pins:[],dark:null},S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dayMs=864e5;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
const curDay=()=>S.start?Math.min(30,Math.max(1,Math.round((sod(Date.now())-sod(S.start))/dayMs)+1)):0;
if(S.start&&!S.selTouched)S.sel=curDay()||1;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dark=()=>S.dark===null?matchMedia('(prefers-color-scheme: dark)').matches:S.dark;
function applyTheme(){document.body.classList.toggle('dark',dark());document.querySelector('meta[name=theme-color]').content=dark()?'#1f252d':'#f3f2ec'}
applyTheme();

/* ---------- map style ---------- */
function buildStyle(d){
 const P=d?PAL.dark:PAL.light;
 const cls=(...a)=>['match',['get','class'],a,true,false];
 const nm=['coalesce',['get','name:latin'],['get','name']];
 const W=(s,x)=>['interpolate',['exponential',1.4],['zoom'],...s.flatMap(([z,w])=>[z,x?w+(w>.8?1.6:.6):w])];
 const L=[];
 const add=o=>L.push(o);
 add({id:'bg',type:'background',paint:{'background-color':P.land}});
 add({id:'lc1',type:'fill',source:'om','source-layer':'landcover',filter:cls('grass','farmland'),paint:{'fill-color':P.grass}});
 add({id:'lc2',type:'fill',source:'om','source-layer':'landcover',filter:cls('wood'),paint:{'fill-color':P.wood}});
 add({id:'park',type:'fill',source:'om','source-layer':'park',paint:{'fill-color':P.park}});
 add({id:'lu-ind',type:'fill',source:'om','source-layer':'landuse',filter:cls('industrial'),paint:{'fill-color':P.ind}});
 add({id:'lu-indE',type:'line',source:'om','source-layer':'landuse',minzoom:12,filter:cls('industrial'),paint:{'line-color':P.indE,'line-width':1.2}});
 add({id:'lu-com',type:'fill',source:'om','source-layer':'landuse',filter:cls('commercial','retail'),paint:{'fill-color':P.com}});
 add({id:'lu-hosp',type:'fill',source:'om','source-layer':'landuse',filter:cls('hospital'),paint:{'fill-color':P.hosp}});
 add({id:'lu-sch',type:'fill',source:'om','source-layer':'landuse',filter:cls('school','university','college','kindergarten'),paint:{'fill-color':P.school}});
 add({id:'lu-grn',type:'fill',source:'om','source-layer':'landuse',filter:cls('cemetery','pitch','playground','stadium'),paint:{'fill-color':P.grass}});
 add({id:'water',type:'fill',source:'om','source-layer':'water',paint:{'fill-color':P.water}});

 if(!o.addr){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${o.lat}&lon=${o.lon}`);const j=await r.json();const a=j.address||{};const line=[a.road,a.house_number].filter(Boolean).join(' ')||(j.display_name||'').split(',').slice(0,2).join(',');
   if(draft&&draft.id&&cur===draft){draft.addr=line;const fa=$('#fa');if(fa&&!fa.value)fa.value=line;if(!draft.name&&j.name){draft.name=j.name;const fn=$('#fn');if(fn&&!fn.value)fn.value=j.name}}}catch(x){}
 }
}

/* ---------- search ---------- */
let qT;
$('#q').addEventListener('input',()=>{
 const v=$('#q').value.trim();$('#clr').style.display=v?'block':'none';
 clearTimeout(qT);
 if(!v){render();return}
 qT=setTimeout(()=>doSearch(v),450);
});
$('#clr').addEventListener('click',()=>{$('#q').value='';$('#clr').style.display='none';render()});
async function doSearch(v){
 $('#body').innerHTML='<div class="empty">Searching…</div>';
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=it&viewbox=12.30,42.05,12.80,41.70&q='+encodeURIComponent(v));
  const j=await r.json();
  if(!j.length){$('#body').innerHTML='<div class="empty">No results.</div>';return}
  $('#body').innerHTML='<div class="list">'+j.map((x,i)=>`<div class="li" data-i="${i}"><div><div class="t">${esc(x.name||x.display_name.split(',')[0])}</div><div class="sub">${esc(x.display_name.split(',').slice(1,4).join(','))}</div></div></div>`).join('')+'</div>';
  $('#body').onclick=ev=>{const li=ev.target.closest('.li');if(!li)return;const x=j[+li.dataset.i];fly([+x.lat,+x.lon],17);newDraft({lat:+x.lat,lon:+x.lon,name:x.name||'',addr:x.display_name.split(',').slice(0,2).join(',').trim()})};
 }catch(e){$('#body').innerHTML='<div class="empty">Search needs a connection.</div>'}
}

/* ---------- scan (wholesale / warehouses) ---------- */
function typeOf(t){const n=(t.name||'').toLowerCase();if(t.shop==='wholesale')return /cash/.test(n)?'Cash & carry':'Wholesale';if(t.building==='warehouse')return 'Warehouse';if(t.office==='logistics')return 'Logistics hub';return /cash/.test(n)?'Cash & carry':'Wholesale'}
async function scan(){
 const z=map.getZoom();if(z<12.5){toast('Zoom in a little to scan');return}
 const b=map.getBounds(),bb=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(x=>x.toFixed(5)).join(',');
 const q=`[out:json][timeout:12][bbox:${bb}];(nwr[shop=wholesale];nwr[building=warehouse];nwr[office=logistics];nwr[industrial~"warehouse|logistics"];nwr[shop][name~"ingrosso|magazzin|cash|import|export|trading|logistic",i];);out center 200;`;
 const btn=$('#scan');btn.classList.add('busy');
 const EPS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
 let j=null;
 for(let i=0;i<EPS.length&&!j;i++){
  btn.textContent=`Scanning… ${i+1}/${EPS.length}`;
  const t0=Date.now();
  try{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),15000);const r=await fetch(EPS[i],{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:ac.signal});clearTimeout(t);
   if(r.ok){const x=await r.json();const bad=(x.remark&&/error|timed out|runtime/i.test(x.remark))||(!x.elements.length&&Date.now()-t0>11000);if(!bad)j=x}}catch(e){}
 }
 btn.classList.remove('busy');btn.textContent='Scan this area';
 const here=SCOUT.filter(s=>!isAdded(s)&&b.contains([s.lon,s.lat])).length;
 if(!j){toast(here?`Map server busy · ${here} scouted places here are on the map`:'Map server busy. Try again in a minute.');return}
 candMk.forEach(m=>m.remove());candMk=[];cands=[];
 const seen=new Set();
 j.elements.forEach(el=>{
  const t=el.tags||{};const lat=el.lat||(el.center&&el.center.lat),lon=el.lon||(el.center&&el.center.lon);
  if(lat==null||lon==null)return;
  const name=t.name||'';const key=name+lat.toFixed(4)+lon.toFixed(4);if(seen.has(key))return;seen.add(key);
  if(S.pins.some(p=>Math.abs(p.lat-lat)<.00015&&Math.abs(p.lon-lon)<.00015))return;
  const addr=[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' ');
  cands.push({id:uid(),name:name||'Unnamed '+(t.shop||t.building||'place'),addr,lat,lon,status:'todo',type:typeOf(t),contact:'',phone:t.phone||t['contact:phone']||'',notes:'',day:S.sel});
 });
 cands.forEach(c=>{
  const e=document.createElement('div');e.className='cand';e.title=c.name;
  e.addEventListener('click',ev=>{ev.stopPropagation();openCand(c)});
  candMk.push(new maplibregl.Marker({element:e,anchor:'center'}).setLngLat([c.lon,c.lat]).addTo(map));
 });
 toast(cands.length?`${cands.length} places found · tap a grey dot to add`:here?`Nothing tagged here on OpenStreetMap · ${here} scouted places shown`:'Nothing mapped here. Try another area.');
}
function openCand(c){
 if(draftMk){draftMk.remove();draftMk=null}
 draft=Object.assign({},c,{id:uid(),day:S.sel});
 openDetail(null,draft);
}
$('#scan').addEventListener('click',scan);
function toggleScan(){$('#scan').style.display=map.getZoom()>=12.5?'block':'none'}
map.on('zoom',toggleScan);toggleScan();

/* ---------- controls ---------- */
$('#zi').onclick=()=>map.zoomIn();$('#zo').onclick=()=>map.zoomOut();
$('#cmp').onclick=()=>map.easeTo({bearing:0,pitch:0});
map.on('rotate',()=>{$('#cmp svg').style.transform=`rotate(${-map.getBearing()}deg)`});
let meMk=null;
$('#loc').onclick=()=>{if(!navigator.geolocation){toast('Location unavailable');return}
 navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.longitude,p.coords.latitude];if(!meMk){const e=document.createElement('div');e.className='me';meMk=new maplibregl.Marker({element:e}).setLngLat(ll).addTo(map)}else meMk.setLngLat(ll);map.flyTo({center:ll,zoom:16})},()=>toast('Location blocked. Allow it in system settings.'),{enableHighAccuracy:true,timeout:8000})};
$('#mode').onclick=()=>{S.dark=!dark();save();applyTheme();map.setStyle(buildStyle(dark()))};
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.dark===null){applyTheme();map.setStyle(buildStyle(dark()))}});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;TAB.v=b.dataset.t;$('#q').value='';$('#clr').style.display='none';render()});
function render(){
 [...$('#seg').children].forEach(b=>b.classList.toggle('on',b.dataset.t===TAB.v));
 $('#body').onclick=null;
 TAB.v==='quest'?renderQuest():renderPlaces();
 syncPins();
}
// bottom sheet on small screens
$('#grab').addEventListener('click',()=>{const p=$('#panel');if(p.classList.contains('peek'))p.classList.remove('peek');else if(p.classList.contains('full')){p.classList.remove('full');p.classList.add('peek')}else p.classList.add('full')});
if(matchMedia('(max-width:720px)').matches)$('#panel').classList.add('peek');
map.on('load',()=>{render()});
render();
// Fresh scouted places from the website, so new finds reach the Mac app and the phone without a reinstall.
(()=>{const u=(TAURI?'https://waleedrana777.github.io/roma-quest/':'')+'scout.json?t='+Date.now();
 fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(Array.isArray(j)&&j.length){SCOUT.length=0;SCOUT.push(...j);syncScout();if(TAB.v!=='quest')render()}}).catch(()=>{})})();
window.__rq={map,S,openDetail};
})();
</script>
</body>
</html>
